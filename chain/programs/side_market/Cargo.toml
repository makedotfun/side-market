[package]
name = "side_market"
version = "0.1.0"
description = "make.fun side market: per-entry YES/NO prediction markets in USDC, priced by a mass-weighted LMSR in Q64.64, with scratches, halts, a disputed resolution and void at marks"
edition.workspace = true
rust-version.workspace = true
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "side_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# anchor-spl 1.2.1's idl_build.rs implements IdlBuild for token_interface::{Mint, TokenAccount}
# without gating them on token_2022, so its idl-build feature does not compile without it. The
# feature only reaches the host-side IDL build (`anchor build` runs it as a test); the SBF program
# never enables idl-build, so the deployed program still carries no Token-2022 code.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []
# No test-windows feature: the dispute delay is a Config field (min_dispute_secs), so every
# cluster runs the one release build.

[dependencies]
# event-cpi: every state change emits its event with emit_cpi!, a self-CPI the runtime records in
# the transaction's inner instructions, where a log truncated by a CPI caller cannot hide it.
# init-if-needed: settle_ticket creates the wallet's associated token account when missing.
anchor-lang = { version = "1.2.1", features = ["init-if-needed", "event-cpi"] }
# Classic SPL Token and the associated-token program only: no token_2022 (a transfer-hook or
# fee-bearing mint cannot reach the vault). solana-v3 is anchor-spl's default Solana 3.x cohort,
# restated because default features are off.
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "associated_token", "solana-v3"] }
# security.txt (lib.rs): where a researcher reports a vulnerability, embedded in the program's
# bytes and read by explorers.
solana-security-txt = "=1.1.3"

[dev-dependencies]
# The same LiteSVM, feature pin and transaction crates prize_escrow's tests use (its Cargo.toml
# says why each): no crate the workspace does not already lock. The tests load the release build
# (tests/program_so), and prize_escrow's release build for the escrow cross-check, driving it by
# hand-encoded instructions (this crate never depends on another program's).
litesvm = "0.18.1"
agave-feature-set = { version = "4.3", features = ["agave-unstable-api"] }
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4"
solana-transaction-error = "3"
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
serde_json = "1"
# The property tests (tests/properties.rs): random trades, joins, scratches, halts and voids.
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
